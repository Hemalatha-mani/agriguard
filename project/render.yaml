services:
  - type: web
    name: crop-disease-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_PATH
        value: ml_models/crop_disease_model_final.keras
      - key: MODEL_INPUT_SIZE
        value: "224"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

  - type: pserv
    name: crop-disease-db
    plan: free
    databaseName: crop_disease_db
    user: crop_disease_user
